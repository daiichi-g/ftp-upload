name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - issue*
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: ビルド
        run: dotnet publish --no-restore -c Release
